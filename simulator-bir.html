<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סימולטור ראיון עבודה · עתיד אבדאע ביר אלמכסור</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* סימולטור ראיון עבודה לעמדה בכנס המנהלים 23.11
   בוגרים = צהוב. רקע בהיר בלבד, שחור רק לטקסט. */
:root{
  --yellow:#FFF200; --yellow-deep:#FFD500; --yellow-soft:#FFFCE6;
  --pink-deep:#C2185B;
  --ink:#111111; --ink-2:#3A3A3A; --muted:#6B6B6B;
  --line:#E9E7E4; --bg:#FAF8F5; --card:#FFFFFF;
  --good:#2C7D45; --good-soft:#E8F5EC;
  --mid:#9A6A00; --mid-soft:#FFF4D6;
  --weak:#B3261E; --weak-soft:#FDECEA;
  --r:22px;
  --shadow:0 1px 2px rgba(17,17,17,.04), 0 10px 32px rgba(17,17,17,.07);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Rubik,"Heebo","Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none}
.topbar{height:8px;background:linear-gradient(90deg,var(--yellow-deep),var(--yellow))}
.app{min-height:calc(100% - 8px);display:flex;flex-direction:column;max-width:980px;margin:0 auto;padding:20px 16px 12px}
header.school{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.badge{display:flex;align-items:center;gap:12px;min-width:0}
.badge .mark{flex:none;width:52px;height:52px;border-radius:14px;background:var(--yellow);display:grid;place-items:center}
.badge .mark svg{width:28px;height:28px}
.badge .name{font-weight:800;font-size:20px;line-height:1.2}
.badge .sub{font-size:14px;color:var(--muted)}
.lang{display:flex;gap:6px;flex:none}
.lang button{font:inherit;font-size:15px;font-weight:600;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink-2);border-radius:999px;padding:8px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{flex:1;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:in .35s ease}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* פתיחה */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:18px;padding:12px 4px 24px}
.kicker{display:inline-block;background:var(--yellow);font-weight:700;font-size:16px;padding:6px 14px;border-radius:999px}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.hero p{font-size:clamp(18px,2.4vw,22px);color:var(--ink-2);margin:0;max-width:640px}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.steps span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;color:var(--ink-2)}

.btn{font:inherit;font-weight:700;font-size:22px;border:0;border-radius:999px;padding:16px 34px;cursor:pointer;
  background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:10px;min-height:60px}
.btn svg{width:24px;height:24px}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:active{transform:scale(.98)}

/* שאלה */
.progress{display:flex;gap:8px;margin-bottom:16px}
.progress i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.progress i.done{background:var(--yellow-deep)}
.progress i.now{background:var(--ink)}
.interviewer{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.avatar{flex:none;width:56px;height:56px;border-radius:50%;background:var(--card);border:2px solid var(--ink);display:grid;place-items:center}
.avatar svg{width:30px;height:30px}
.bubble{background:var(--card);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);border-top-right-radius:6px}
[dir="ltr"] .bubble{border-top-right-radius:var(--r);border-top-left-radius:6px}
.bubble small{display:block;color:var(--muted);font-size:14px;margin-bottom:2px}
.bubble h2{margin:0;font-size:clamp(24px,3.6vw,34px);line-height:1.25;font-weight:800}
.prompt{font-size:17px;color:var(--muted);margin:0 0 10px}
.answers{display:grid;gap:12px}
.ans{font:inherit;text-align:start;font-size:clamp(18px,2.3vw,21px);line-height:1.45;background:var(--card);color:var(--ink);
  border:2px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;display:flex;gap:14px;align-items:flex-start}
.ans .letter{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:16px}
.ans:disabled{cursor:default}
.ans.picked{border-color:var(--ink)}
.ans.picked .letter{background:var(--ink);color:#fff;border-color:var(--ink)}
.ans.best:not(.picked){border-color:var(--good);border-style:dashed}
.answers.locked .ans:not(.picked):not(.best){opacity:.5}

.feedback{display:none;margin-top:16px;border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);background:var(--card);border-inline-start:8px solid var(--good)}
.feedback.show{display:block;animation:in .3s ease}
.feedback.mid{border-inline-start-color:var(--mid)}
.feedback.weak{border-inline-start-color:var(--weak)}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:20px;padding:4px 12px;border-radius:999px;background:var(--good-soft);color:var(--good);margin-bottom:8px}
.feedback.mid .verdict{background:var(--mid-soft);color:var(--mid)}
.feedback.weak .verdict{background:var(--weak-soft);color:var(--weak)}
.verdict svg{width:20px;height:20px}
.feedback p{margin:0 0 10px;font-size:19px}
.why{font-size:17px;color:var(--ink-2)}
.why b{color:var(--ink)}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--yellow-soft);border-radius:14px;padding:12px 14px;font-size:17px;margin-top:8px}
.tip svg{flex:none;width:22px;height:22px;margin-top:3px}
.next{margin-top:16px;display:flex;justify-content:flex-end}

/* סיום */
.end{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:8px 4px 20px}
.end .kicker{align-self:flex-start}
.end h1{font-size:clamp(32px,5.4vw,52px);line-height:1.12;margin:0;font-weight:800}
.end .lead{font-size:clamp(18px,2.4vw,22px);color:var(--ink-2);margin:0;max-width:700px}
.tips-sum{display:grid;gap:10px;margin:4px 0}
.tips-sum div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:18px}
.tips-sum b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:15px}
.quote{border-inline-start:6px solid var(--yellow-deep);background:var(--card);border-radius:14px;padding:14px 18px;font-size:18px;color:var(--ink-2)}
.quote small{display:block;color:var(--muted);font-size:14px;margin-top:6px}

footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 0 4px;color:var(--muted);font-size:14px;text-align:center;flex-wrap:wrap}
footer img{height:26px;width:auto}

@media (max-width:560px){
  body{font-size:17px}
  .app{padding:14px 16px 10px}
  header.school{flex-direction:column;align-items:flex-start}
  .badge .mark{width:44px;height:44px}
  .badge .name{font-size:18px}
  .btn{font-size:20px;padding:14px 26px;width:100%;justify-content:center}
  .next .btn{width:auto}
  .interviewer{gap:10px}
  .avatar{width:44px;height:44px}
}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="app">
  <header class="school">
    <div class="badge">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
      </div>
      <div>
        <div class="name" data-t="school"></div>
        <div class="sub" data-t="schoolSub"></div>
      </div>
    </div>
    <div class="lang" role="group" aria-label="שפה">
      <button type="button" data-lang="he" aria-pressed="true">עברית</button>
      <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
    </div>
  </header>

  <main>
    <section class="screen on" id="s-start">
      <div class="hero">
        <span class="kicker" data-t="kicker"></span>
        <h1 data-t="title"></h1>
        <p data-t="intro"></p>
        <div class="steps"><span data-t="st1"></span><span data-t="st2"></span><span data-t="st3"></span></div>
        <button class="btn yellow" type="button" id="go">
          <span data-t="start"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="flip"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
    </section>

    <section class="screen" id="s-q">
      <div class="progress" id="prog"><i></i><i></i><i></i></div>
      <div class="interviewer">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        </div>
        <div class="bubble">
          <small id="qnum"></small>
          <h2 id="qtext"></h2>
        </div>
      </div>
      <p class="prompt" data-t="pick"></p>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="fb" aria-live="polite">
        <div class="verdict" id="verdict"></div>
        <p id="fbtext"></p>
        <div class="why"><b data-t="whyLabel"></b> <span id="why"></span></div>
        <div class="tip">
          <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
          <span><b data-t="tipLabel"></b> <span id="tip"></span></span>
        </div>
        <div class="next"><button class="btn" type="button" id="nextBtn"></button></div>
      </div>
    </section>

    <section class="screen" id="s-end">
      <div class="end">
        <span class="kicker" data-t="endKicker"></span>
        <h1 data-t="endTitle"></h1>
        <p class="lead" data-t="endLead"></p>
        <div class="tips-sum" id="tipsSum"></div>
        <div class="quote"><span data-t="planQuote"></span><small data-t="planSrc"></small></div>
        <div><button class="btn ghost" type="button" id="again">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span data-t="again"></span>
        </button></div>
      </div>
    </section>
  </main>

  <footer>
    <span data-t="partner"></span>
    <img src="hopa-logo.png" alt="הופה" onerror="this.style.display='none'">
  </footer>
</div>

           w:"מעסיק סולח על טעויות. מה שקשה לו לסלוח זה לגלות אותן אחר כך."},
          {t:"אסביר שזה לא באשמתי, כי ההוראות לא היו ברורות.", l:"mid",
           f:"אולי זה נכון, אבל המעסיק שומע כאן חיפוש אשמים.",
           w:"אפשר להגיד שההוראות לא היו ברורות, אחרי שלוקחים אחריות ולא במקום זה."},
          {t:"אספר לאחראי/ת מיד, אסביר מה קרה ואשאל איך לתקן.", l:"good",
           f:"זו התשובה שמעסיקים הכי רוצים לשמוע.",
           w:"לקיחת אחריות היא מה שהופך עובד חדש לעובד שסומכים עליו."}
        ],
        tip: "\"טעיתי, הנה מה שקרה, איך מתקנים?\" הם שלושה משפטים שבונים אמון."
      },
      ar: {
        q: "أخطأت في العمل وتعطّل شيء ما. ماذا ستفعل/ين؟",
        a: [
          {t:"لن أقول شيئًا وسأحاول الإصلاح وحدي قبل أن ينتبه أحد.", l:"weak",
           f:"مفهوم أن نريد الإصلاح وحدنا، لكن هكذا قد يكبر الخطأ الصغير.",
           w:"صاحب العمل يسامح على الأخطاء. ما يصعب عليه مسامحته هو أن يكتشفها لاحقًا."},
          {t:"سأشرح أن هذا ليس ذنبي، لأن التعليمات لم تكن واضحة.", l:"mid",
           f:"ربما هذا صحيح، لكن صاحب العمل يسمع هنا بحثًا عن مذنب.",
           w:"يمكن القول إن التعليمات لم تكن واضحة، بعد تحمّل المسؤولية وليس بدلًا منها."},
          {t:"سأخبر المسؤول فورًا، وأشرح ما حدث وأسأل كيف أُصلح.", l:"good",
           f:"هذه هي الإجابة التي يحبّ أصحاب العمل سماعها أكثر من أي شيء.",
           w:"تحمّل المسؤولية هو ما يجعل العامل الجديد عاملًا يُعتمد عليه."}
        ],
        tip: "\"أخطأت، هذا ما حدث، كيف نُصلح؟\" ثلاث جمل تبني الثقة."
      }
    },
    {
      he: {
        q: "למה שנבחר דווקא בך?",
        a: [
          {t:"כי אני הכי טוב/ה מכל המועמדים.", l:"mid",
           f:"ביטחון זה טוב, אבל בלי דוגמה זו רק סיסמה.",
           w:"המעסיק לא מכיר את שאר המועמדים דרכך. הוא רוצה לשמוע עובדה אחת עלייך, לא השוואה."},
          {t:"כי אני צריך/ה את הכסף.", l:"weak",
           f:"כולם צריכים, וזה לגיטימי. אבל זו סיבה שלך, לא שלו.",
           w:"השאלה היא מה המעסיק ירוויח ממך. התשובה צריכה לדבר על מה שאת/ה מביא/ה."},
          {t:"כי אני מגיע/ה בזמן, לומד/ת מהר ורוצה להישאר כאן ולהתקדם.", l:"good",
           f:"חזק. נתת למעסיק שלוש סיבות שהוא יכול לבדוק.",
           w:"מעסיק משקיע בעובד חדש. הוא רוצה לדעת שאת/ה אמין/ה ושתישאר/י."}
        ],
        tip: "עונים במה שאת/ה נותן/ת למקום, ומביאים דוגמה אחת קטנה."
      },
      ar: {
        q: "لماذا نختارك أنت بالذات؟",
        a: [
          {t:"لأنني الأفضل بين كل المرشحين.", l:"mid",
           f:"الثقة بالنفس جيدة، لكن بدون مثال تبقى مجرد شعار.",
           w:"صاحب العمل لا يعرف بقية المرشحين من خلالك. يريد أن يسمع حقيقة واحدة عنك، لا مقارنة."},
          {t:"لأنني بحاجة إلى المال.", l:"weak",
           f:"الجميع بحاجة، وهذا مشروع. لكنه سببك أنت، لا سببه هو.",
           w:"السؤال هو ماذا سيكسب صاحب العمل منك. الإجابة يجب أن تتحدث عمّا تقدّمه."},
          {t:"لأنني أصل في الوقت، أتعلّم بسرعة، وأريد أن أبقى هنا وأتقدّم.", l:"good",
           f:"قوية. أعطيت صاحب العمل ثلاثة أسباب يستطيع أن يتحقق منها.",
           w:"صاحب العمل يستثمر في العامل الجديد. يريد أن يعرف أنك موثوق وأنك ستبقى."}
        ],
        tip: "أجيبوا بما تقدّمونه للمكان، وأضيفوا مثالًا صغيرًا واحدًا."
      }
    }
  ];

  var LETTERS = {he:["א","ב","ג"], ar:["أ","ب","ج"]};
  var ICON = {
    good:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    mid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>',
    weak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5v.5"/></svg>'
  };

  var lang = "he", qi = 0, answered = false, current = "s-start";
  var $ = function(id){ return document.getElementById(id); };

  function applyLang(){
    document.documentElement.lang = lang;
    document.documentElement.dir = "rtl";
    document.title = lang === "he" ? "סימולטור ראיון עבודה · עתיד אבדאע ביר אלמכסור" : "محاكي مقابلة عمل · عتيد إبداع بئر المكسور";
    var nodes = document.querySelectorAll("[data-t]");
    for (var i=0;i<nodes.length;i++){ var k = nodes[i].getAttribute("data-t"); if (T[lang][k] != null) nodes[i].textContent = T[lang][k]; }
    var bs = document.querySelectorAll(".lang button");
    for (var j=0;j<bs.length;j++) bs[j].setAttribute("aria-pressed", bs[j].getAttribute("data-lang") === lang ? "true" : "false");
    if (current === "s-q") renderQ(true);
    if (current === "s-end") renderEnd();
  }

  function show(id){
    current = id;
    var s = document.querySelectorAll(".screen");
    for (var i=0;i<s.length;i++) s[i].classList.toggle("on", s[i].id === id);
    window.scrollTo(0,0);
  }

  var picks = [];
  function renderQ(keepPick){
    var q = Q[qi][lang];
    $("qnum").textContent = T[lang].qOf.replace("{n}", qi+1);
    $("qtext").textContent = q.q;
    var bars = $("prog").children;
    for (var i=0;i<bars.length;i++){ bars[i].className = i<qi ? "done" : (i===qi ? "now" : ""); }
    var box = $("answers"); box.innerHTML = ""; box.classList.remove("locked");
    q.a.forEach(function(a, i){
      var b = document.createElement("button");
      b.type = "button"; b.className = "ans";
      b.innerHTML = '<span class="letter"></span><span class="txt"></span>';
      b.querySelector(".letter").textContent = LETTERS[lang][i];
      b.querySelector(".txt").textContent = a.t;
      b.addEventListener("click", function(){ choose(i); });
      box.appendChild(b);
    });
    $("fb").className = "feedback";
    if (keepPick && answered) choose(picks[qi], true); else answered = false;
  }

  function choose(i, silent){
    if (answered && !silent) return;
    answered = true; picks[qi] = i;
    var q = Q[qi][lang], a = q.a[i];
    var btns = $("answers").children;
    for (var k=0;k<btns.length;k++){
      btns[k].disabled = true;
      btns[k].classList.toggle("picked", k===i);
      btns[k].classList.toggle("best", q.a[k].l === "good");
    }
    $("answers").classList.add("locked");
    var fb = $("fb");
    fb.className = "feedback show " + a.l;
    $("verdict").innerHTML = ICON[a.l] + "<span></span>";
    $("verdict").querySelector("span").textContent = T[lang][a.l];
    $("fbtext").textContent = a.f;
    $("why").textContent = a.w;
    $("tip").textContent = q.tip;
    $("nextBtn").textContent = qi < Q.length-1 ? T[lang].next : T[lang].finish;
    if (!silent) setTimeout(function(){ fb.scrollIntoView({behavior:"smooth", block:"nearest"}); }, 60);
  }

  function renderEnd(){
    var box = $("tipsSum"); box.innerHTML = "";
    Q.forEach(function(q, i){
      var d = document.createElement("div");
      d.innerHTML = "<b></b><span></span>";
      d.querySelector("b").textContent = i+1;
      d.querySelector("span").textContent = q[lang].tip;
      box.appendChild(d);
    });
  }

  function reset(){ qi = 0; answered = false; picks = []; show("s-start"); }

  $("go").addEventListener("click", function(){ qi = 0; answered = false; picks = []; show("s-q"); renderQ(); });
  $("nextBtn").addEventListener("click", function(){
    if (qi < Q.length-1){ qi++; answered = false; renderQ(); window.scrollTo({top:0, behavior:"smooth"}); }
    else { renderEnd(); show("s-end"); }
  });
  $("again").addEventListener("click", reset);
  var lb = document.querySelectorAll(".lang button");
  for (var i=0;i<lb.length;i++) lb[i].addEventListener("click", function(){ lang = this.getAttribute("data-lang"); applyLang(); });

  /* חזרה אוטומטית להתחלה אחרי דקה וחצי בלי מגע */
  var idle;
  function bump(){ clearTimeout(idle); idle = setTimeout(function(){ if (current !== "s-start"){ reset(); } }, 90000); }
  ["pointerdown","keydown","scroll","touchstart"].forEach(function(ev){ document.addEventListener(ev, bump, {passive:true}); });
  bump();

  applyLang();
})();
</script>
</body>
</html>
