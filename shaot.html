<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>דיווח שעות · הופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#E8348A;--pink-d:#c4206f;--soft:#fde9f2;--y:#FFF200;--ink:#1d1b20;--muted:#6b6670;--line:#ebe4ec;--bg:#faf6f8;--card:#fff;--ok:#1f8a5b;--ok-soft:#e3f5ec;--warn:#b45309;--warn-soft:#fff4e0;--red:#c0392b;--shadow:0 4px 18px rgba(80,20,50,.07)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Rubik,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 40px}
.top{background:linear-gradient(125deg,var(--pink),var(--pink-d));color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px;box-shadow:var(--shadow)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{height:34px;background:#fff;border-radius:10px;padding:4px 8px;display:block}
.top h1{font-size:19px;margin:0;font-weight:800;flex:1}
.top small{display:block;font-weight:400;font-size:13px;opacity:.9}
.top .out{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:6px;margin:14px 0 6px;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--soft);color:var(--pink-d)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 svg{color:var(--pink)}
.muted{color:var(--muted);font-size:14px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:18px;font-size:20px;font-weight:800;cursor:pointer;color:#fff;background:var(--pink)}
.big.end{background:var(--ink)}
.big:disabled{opacity:.5}
.status{text-align:center;margin-bottom:12px}
.status b{font-size:30px;display:block;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.chip.on{border-color:var(--pink);background:var(--soft);color:var(--pink-d);font-weight:600}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--pink);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:#fff;color:var(--pink-d);border:1.5px solid var(--pink)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.full{width:100%;justify-content:center;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{list-style:none;margin:10px 0 0;padding:0}
.list li{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.list li:first-child{border-top:0}
.list .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--pink-d);margin-inline-end:4px;margin-top:3px}
.tag.g{background:#f0eef2;color:var(--muted)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.kpi{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:22px;color:var(--ink);font-weight:800}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font-size:17px}
.mnav button{border:1.5px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-child{border-top:0}
.day-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-h .d{font-weight:700;min-width:84px}
.day-h .h{margin-inline-start:auto;font-weight:700}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:15px}
.alert b{color:var(--ink)}
.err{background:#fdecea;color:var(--red);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:15px;display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,20,.4);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sheet-bg.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:18px}
.person{border-inline-start:5px solid var(--pink)}
.person h2{justify-content:space-between}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto}
.moments p{margin:8px 0;padding:8px 12px;background:var(--bg);border-radius:12px;font-size:15px}
.moments p small{color:var(--muted);display:block}
details summary{cursor:pointer;color:var(--pink-d);font-weight:600;font-size:15px;margin-top:10px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.login{max-width:420px;margin:30px auto 0}
.hide{display:none!important}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
footer a{color:var(--pink-d)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a href="https://hopa.org.il" target="_blank" rel="noopener"><img src="hopa-logo.png" alt="הופה"></a>
    <h1>דיווח שעות<small id="hello">צוות הופה</small></h1>
    <button class="out hide" id="logout" type="button">יציאה</button>
  </div>
</header>

<main class="wrap">

  <!-- כניסה -->
  <section id="loginView" class="login">
    <div class="card">
      <h2>כניסה</h2>
      <label class="f">מי את/ה?</label>
      <div class="chips" id="whoChips"></div>
      <label class="f" for="code">קוד אישי</label>
      <input type="password" id="code" inputmode="numeric" autocomplete="current-password" placeholder="6 ספרות">
      <button class="btn full" id="loginBtn" type="button">כניסה</button>
      <div class="err" id="loginErr"></div>
    </div>
  </section>

  <section id="appView" class="hide">
    <nav class="tabs" id="tabs">
      <button type="button" data-t="today" class="on">היום</button>
      <button type="button" data-t="month">החודש שלי</button>
      <button type="button" data-t="team" class="hide" id="teamTab">צוות</button>
    </nav>
    <div class="err" id="appErr"></div>

    <!-- היום -->
    <div id="v-today">
      <div class="alert hide" id="staleOpen"></div>

      <div class="card">
        <div class="status" id="status"></div>
        <button class="big" id="dayBtn" type="button"></button>
        <div id="todaySess" class="muted" style="text-align:center;margin-top:10px"></div>
      </div>

      <div class="card">
        <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>סוג היום</h2>
        <div class="chips" id="typeChips"></div>
      </div>

      <div class="card">
        <h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>מה עשיתי היום</h2>
        <label class="f" for="tText">משימה</label>
        <textarea id="tText" placeholder="למשל: שיחת מעקב עם 6 בוגרים מכרמיאל"></textarea>
        <label class="f">בשביל מי?</label>
        <div class="chips" id="fwChips"></div>
        <div class="row2">
          <div>
            <label class="f" for="tSchool">בית ספר</label>
            <select id="tSchool"></select>
          </div>
          <div>
            <label class="f" for="tPeople">כמה אנשים הושפעו?</label>
            <input type="number" id="tPeople" min="0" max="9999" inputmode="numeric" placeholder="לא חובה">
          </div>
        </div>
        <button class="btn full" id="addTask" type="button">הוספת משימה</button>
        <ul class="list" id="taskList"></ul>
      </div>
    </div>

    <!-- החודש שלי -->
    <div id="v-month" class="hide">
      <div class="card">
        <div class="mnav"><button type="button" data-m="1" aria-label="חודש קודם"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button><b id="mTitle"></b><button type="button" data-m="-1" aria-label="חודש הבא"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button></div>
        <div class="kpis" id="mKpis"></div>
      </div>
      <div class="card">
        <h2>ימים</h2>
        <div id="mDays"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          <button class="btn ghost sm" type="button" id="addManual">הוספת יום שלא דווח</button>
          <button class="btn ghost sm" type="button" id="addAbsence">סימון חופש / מחלה / מילואים</button>
        </div>
      </div>
      <div class="card moments">
        <h2>רגעים משמעותיים</h2>
        <div id="mMoments"></div>
      </div>
    </div>

    <!-- צוות (מנהלת) -->
    <div id="v-team" class="hide">
      <div class="card">
        <div class="mnav"><button type="button" data-a="1" aria-label="חודש קודם"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button><b id="aTitle"></b><button type="button" data-a="-1" aria-label="חודש הבא"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          <button class="btn sm" type="button" id="copyPay">העתקת סיכום לשכר</button>
          <button class="btn ghost sm" type="button" id="copyImpact">העתקת דוח אימפקט</button>
        </div>
        <p class="muted" style="margin:8px 0 0">הסיכום לשכר מודבק ישר לאקסל או לגיליון.</p>
      </div>
      <div id="aOpen"></div>
      <div id="aPeople"></div>
      <div class="card">
        <h2>אימפקט הצוות החודש</h2>
        <div class="kpis" id="aKpis"></div>
        <div id="aImpact" style="margin-top:10px"></div>
      </div>
    </div>
  </section>

  <footer>
    <a href="https://hopa.org.il" target="_blank" rel="noopener">hopa.org.il</a> · נבנה ע״י impactos
  </footer>
</main>

<!-- חלונית -->
<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script src="school-codes.js"></script>
<script>
(function(){
'use strict';
/* כתובת השרת (Apps Script של דיווח השעות). ?demo=1 = מצב הדגמה בלי שרת */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwZMaDVNtsJ6lZejtYgeche0j2ZcaavQob5S9iPNRotXfCyi9L7UXfQ3K3dRJhkwgqnZw/exec';
var PEOPLE = ['אסמאא','מיטל','מיטב'];
var FOR_WHOM = ['בוגר/ת','רכז/ת','בית ספר','שותף/ארגון','פנימי'];
var DAY_TYPES = ['עבודה','חופש','מחלה','מילואים'];
var qs = new URLSearchParams(location.search);
var DEMO = qs.get('demo') === '1' || !EXEC_URL;
var WANT_ADMIN = qs.has('admin');

function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ window.localStorage.removeItem(k); }catch(e){} }

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove('on');},2600); }
function showErr(id,t){ var el=$(id); el.textContent=t||''; el.style.display=t?'block':'none'; }
function hm(mins){ mins=+mins||0; var h=Math.floor(mins/60), m=mins%60; return h+':'+(m<10?'0':'')+m; }
function dmy(d){ var p=d.split('-'); return p[2]+'.'+p[1]; }
var HE_DAYS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
function wday(d){ var p=d.split('-'); return HE_DAYS[new Date(+p[0],+p[1]-1,+p[2]).getDay()]; }
var HE_MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function ymTitle(ym){ var p=ym.split('-'); return HE_MONTHS[+p[1]-1]+' '+p[0]; }
function shiftYm(ym,d){ var p=ym.split('-'); var dt=new Date(+p[0],+p[1]-1+d,1); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){ return navigator.clipboard.writeText(t).then(function(){toast('הועתק');},function(){fallbackCopy(t);}); }
  fallbackCopy(t);
}
function fallbackCopy(t){ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('הועתק');}catch(e){toast('ההעתקה נכשלה');} ta.remove(); }

var SCHOOLS = (function(){ var o=window.SCHOOL_CODES||{}; var a=Object.keys(o).map(function(k){return o[k].n;}).filter(Boolean); a.sort(function(x,y){return x.localeCompare(y,'he');}); return ['כללי'].concat(a); })();

/* ---------- שרת ---------- */
var me = { name: lsGet('shaot_name')||'', code: lsGet('shaot_code')||'' };
var S = null, A = null, ymMine = null, ymTeam = null;

function api(action, extra){
  var body = Object.assign({action:action, name:me.name, code:me.code}, extra||{});
  if(DEMO) return Promise.resolve(demoHandle(body));
  var tries = 0;
  function once(){
    tries++;
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var t = ctl ? setTimeout(function(){ctl.abort();}, 45000) : null;
    return fetch(EXEC_URL, {method:'POST', credentials:'omit', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), signal: ctl?ctl.signal:undefined})
      .then(function(r){ if(t) clearTimeout(t); return r.json(); })
      .catch(function(e){ if(t) clearTimeout(t); if(tries<3 && action!=='start' && action!=='end' && action!=='task') return once(); throw new Error('אין חיבור לשרת. לבדוק אינטרנט ולנסות שוב'); });
  }
  return once().then(function(r){ if(!r||!r.ok) throw new Error((r&&r.error)||'שגיאה'); return r; });
}

/* ---------- כניסה ---------- */
var pick = me.name;
function drawWho(){
  $('whoChips').innerHTML = PEOPLE.map(function(n){ return '<button type="button" class="chip'+(pick===n?' on':'')+'" data-n="'+esc(n)+'">'+esc(n)+'</button>'; }).join('');
}
$('whoChips').addEventListener('click', function(e){ var b=e.target.closest('[data-n]'); if(!b) return; pick=b.dataset.n; drawWho(); $('code').focus(); });
$('code').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
$('loginBtn').addEventListener('click', doLogin);
function doLogin(){
  showErr('loginErr','');
  if(!pick) return showErr('loginErr','לבחור שם');
  var c = $('code').value.trim();
  if(!c) return showErr('loginErr','להקליד קוד אישי');
  me = {name:pick, code:c};
  $('loginBtn').innerHTML='<span class="spin"></span>';
  api('state',{ym:ymMine}).then(function(r){
    lsSet('shaot_name',me.name); lsSet('shaot_code',me.code);
    enter(r);
  }).catch(function(e){ showErr('loginErr', e.message); me.code=''; }).then(function(){ $('loginBtn').textContent='כניסה'; });
}
$('logout').addEventListener('click', function(){ lsDel('shaot_code'); me.code=''; S=null; A=null; $('appView').classList.add('hide'); $('loginView').classList.remove('hide'); $('logout').classList.add('hide'); $('hello').textContent='צוות הופה'; $('code').value=''; });

function enter(r){
  $('loginView').classList.add('hide'); $('appView').classList.remove('hide'); $('logout').classList.remove('hide');
  $('hello').textContent = me.name + (DEMO?' · מצב הדגמה':'');
  $('teamTab').classList.toggle('hide', !r.me.admin);
  apply(r);
  if(WANT_ADMIN && r.me.admin) tab('team');
}

/* ---------- לשוניות ---------- */
var cur='today';
$('tabs').addEventListener('click', function(e){ var b=e.target.closest('[data-t]'); if(b) tab(b.dataset.t); });
function tab(t){
  cur=t;
  Array.prototype.forEach.call($('tabs').children, function(b){ b.classList.toggle('on', b.dataset.t===t); });
  ['today','month','team'].forEach(function(k){ $('v-'+k).classList.toggle('hide', k!==t); });
  if(t==='team') loadTeam();
}

function apply(r){
  S = r; ymMine = r.month.ym;
  drawToday(); drawMonth();
}
function run(action, extra, okMsg){
  showErr('appErr','');
  return api(action, Object.assign({ym:ymMine}, extra||{})).then(function(r){ apply(r); if(okMsg) toast(okMsg); if(cur==='team') loadTeam(); return r; })
    .catch(function(e){ showErr('appErr', e.message); window.scrollTo({top:0,behavior:'smooth'}); throw e; });
}

/* ---------- היום ---------- */
var fw = '';
function sessMins(s){ return s.mins===''||s.mins==null ? 0 : +s.mins; }
function drawToday(){
  var t=S.today, open=S.open, stale = open && open.date!==t;
  $('staleOpen').classList.toggle('hide', !stale);
  if(stale) $('staleOpen').innerHTML = '<b>נשאר יום פתוח מ-'+dmy(open.date)+'</b> (התחלה '+esc(open.start)+'). צריך לתקן אותו עם שעת הסיום הנכונה. <button class="btn sm" type="button" data-fix="'+esc(open.id)+'" style="margin-top:8px">תיקון עכשיו</button>';
  var done = S.todaySessions.filter(function(s){return s.end;});
  var total = done.reduce(function(a,s){return a+sessMins(s);},0);
  var btn=$('dayBtn');
  if(open && !stale){
    $('status').innerHTML = '<span class="muted">התחלת היום ב-<span class="ltr">'+esc(open.start)+'</span></span><b id="clock">'+hm(total+minsSince(open.start))+'</b><span class="muted">שעות עבודה היום</span>';
    btn.className='big end'; btn.innerHTML=ic('stop')+'סיימתי יום'; btn.dataset.a='end';
  } else if(done.length){
    $('status').innerHTML = '<b>'+hm(total)+'</b><span class="muted">שעות עבודה היום</span>';
    btn.className='big'; btn.innerHTML=ic('play')+'התחלתי שוב'; btn.dataset.a='start';
  } else {

function summarize(m, name){
  var ss=m.sessions.filter(function(s){return !name||s.name===name;});
  var ts=m.tasks.filter(function(s){return !name||s.name===name;});
  var ty=m.types.filter(function(s){return !name||s.name===name;});
  var days={};
  ss.forEach(function(s){ (days[s.date]=days[s.date]||{sess:[],tasks:[],type:''}).sess.push(s); });
  ts.forEach(function(s){ (days[s.date]=days[s.date]||{sess:[],tasks:[],type:''}).tasks.push(s); });
  ty.forEach(function(s){ (days[s.date]=days[s.date]||{sess:[],tasks:[],type:''}).type=s.type; });
  var mins=ss.reduce(function(a,s){return a+sessMins(s);},0);
  var workDays=Object.keys(days).filter(function(d){return days[d].sess.some(function(s){return s.end;});}).length;
  var cnt=function(t){return ty.filter(function(x){return x.type===t;}).length;};
  var people=ts.reduce(function(a,x){return a+(+x.people||0);},0);
  var schools={}; ts.forEach(function(x){ if(x.school&&x.school!=='כללי') schools[x.school]=(schools[x.school]||0)+1; });
  var byFw={}; ts.forEach(function(x){ if(x.forWhom){ var o=byFw[x.forWhom]=byFw[x.forWhom]||{n:0,p:0}; o.n++; o.p+=(+x.people||0);} });
  var fixes=ss.filter(function(s){return s.reason;}).length;
  var openN=ss.filter(function(s){return s.start&&!s.end;}).length;
  var moments=ss.filter(function(s){return s.moment;}).map(function(s){return {date:s.date,name:s.name,text:s.moment};});
  return {days:days,mins:mins,workDays:workDays,vac:cnt('חופש'),sick:cnt('מחלה'),res:cnt('מילואים'),tasks:ts.length,people:people,schools:schools,byFw:byFw,fixes:fixes,openN:openN,moments:moments};
}

function demoInner(b){
  var pad=function(n){return String(n).padStart(2,'0');};
  var d=new Date(), today=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), now=pad(d.getHours())+':'+pad(d.getMinutes());
  if(!DB){
    DB={sessions:[],tasks:[],types:[]};
    var ym=today.slice(0,7), n=0;
    for(var i=1;i<d.getDate();i++){
      var dd=ym+'-'+pad(i), wd=new Date(d.getFullYear(),d.getMonth(),i).getDay(); if(wd>4) continue;
      PEOPLE.forEach(function(p,j){ if((i+j)%7===3){ DB.types.push({date:dd,name:p,type:'חופש',note:''}); return; }
        var s=8+((i+j)%2), e=s+4+((i*j)%4); DB.sessions.push({id:'d'+(n++),date:dd,name:p,start:pad(s)+':'+(j?'30':'00'),end:pad(e)+':'+(j?'30':'15'),mins:(e-s)*60+(j?0:15),moment:i===4&&j===0?'בוגרת שלא ענתה חודשיים חזרה אליי ונרשמה למכינה':'',origStart:'',origEnd:'',reason:i===9&&j===2?'שכחתי ללחוץ סיום':''});
        DB.tasks.push({id:'t'+(n++),date:dd,name:p,text:['שיחות מעקב עם בוגרים','פגישה עם רכזת','מיפוי מענים','בניית מצגת'][(i+j)%4],forWhom:FOR_WHOM[(i+j)%5],school:SCHOOLS[1+((i*3+j)%(SCHOOLS.length-1))],people:(i+j)%3?String(2+(i%6)):''});
      });
    }
  }
  if(PEOPLE.indexOf(b.name)<0) throw new Error('שם לא מוכר');
  if(!b.code) throw new Error('קוד שגוי');
  var name=b.name, admin=name==='מיטל';
  var open=function(n){ var o=null; DB.sessions.forEach(function(s){ if(s.name===n&&s.start&&!s.end) o=s; }); return o; };
  var mins=function(a,e){ return (+e.slice(0,2)*60+ +e.slice(3))-(+a.slice(0,2)*60+ +a.slice(3)); };
  var a=b.action;
  if(a==='start'){ var o=open(name); if(o&&o.date!==today) throw new Error('נשאר יום פתוח'); if(!o) DB.sessions.push({id:'n'+Date.now(),date:today,name:name,start:now,end:'',mins:'',moment:'',origStart:'',origEnd:'',reason:''}); }
  if(a==='end'){ var o2=open(name); if(o2){ o2.end=now; o2.mins=Math.max(0,mins(o2.start,now)); o2.moment=b.moment||''; } }
  if(a==='task') DB.tasks.push({id:'n'+Date.now(),date:today,name:name,text:b.text,forWhom:b.forWhom,school:b.school,people:b.people});
  if(a==='taskDel') DB.tasks=DB.tasks.filter(function(t){return !(t.id===b.id&&t.name===name);});
  if(a==='dayType'){ DB.types=DB.types.filter(function(t){return !(t.date===b.date&&t.name===name);}); if(b.type!=='עבודה') DB.types.push({date:b.date,name:name,type:b.type,note:''}); }
  if(a==='fix'){ var m=mins(b.start,b.end); if(!(m>0)) throw new Error('שעת הסיום צריכה להיות אחרי שעת ההתחלה');
    if(b.id){ DB.sessions.forEach(function(s){ if(s.id===b.id&&s.name===name){ s.origStart=s.origStart||s.start; s.origEnd=s.origEnd||s.end; s.start=b.start; s.end=b.end; s.mins=m; s.reason=(s.reason?s.reason+' | ':'')+b.reason; } }); }
    else DB.sessions.push({id:'n'+Date.now(),date:b.date,name:name,start:b.start,end:b.end,mins:m,moment:'',origStart:'(נוסף ידנית)',origEnd:'(נוסף ידנית)',reason:b.reason}); }
  var ym=/^\d{4}-\d\d$/.test(b.ym||'')?b.ym:today.slice(0,7);
  var month=function(n){ var f=function(x){return x.date.slice(0,7)===ym&&(!n||x.name===n);}; return {ym:ym,sessions:DB.sessions.filter(f),tasks:DB.tasks.filter(f),types:DB.types.filter(f)}; };
  if(a==='admin'){ if(!admin) throw new Error('אין הרשאה'); return {ok:true,people:PEOPLE,today:today,now:now,month:month(null),open:DB.sessions.filter(function(s){return !s.end;})}; }
  var tt=''; DB.types.forEach(function(t){ if(t.name===name&&t.date===today) tt=t.type; });
  return {ok:true,me:{name:name,admin:admin},today:today,now:now,forWhom:FOR_WHOM,dayTypes:DAY_TYPES,open:open(name),
    todaySessions:DB.sessions.filter(function(s){return s.name===name&&s.date===today;}),todayTasks:DB.tasks.filter(function(t){return t.name===name&&t.date===today;}),todayType:tt,month:month(name)};
}

/* ---------- התחלה ---------- */
drawWho(); drawFw();
if(DEMO){ var n=document.createElement('p'); n.className='muted'; n.style.textAlign='center'; n.textContent='מצב הדגמה: הנתונים לא נשמרים. כל קוד עובד.'; $('loginView').appendChild(n); }
if(me.name&&me.code){
  $('loginView').classList.add('hide');
  api('state').then(enter).catch(function(e){ $('loginView').classList.remove('hide'); showErr('loginErr', e.message); });
}
})();
</script>
